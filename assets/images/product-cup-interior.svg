<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Inside the Matcha Sous pitcher: the magnetic whisk and 40, 80 and 120 millilitre measurement markings on the brushed steel wall">
  <defs>
    <radialGradient id="ci-bg" cx="50%" cy="40%" r="80%">
      <stop offset="0" stop-color="#f7f3ea"/>
      <stop offset="1" stop-color="#e4ddcc"/>
    </radialGradient>
    <radialGradient id="ci-ring" cx="42%" cy="34%" r="75%">
      <stop offset="0" stop-color="#f1f4f5"/>
      <stop offset="0.5" stop-color="#cbd0d3"/>
      <stop offset="1" stop-color="#a4abae"/>
    </radialGradient>
    <radialGradient id="ci-wall" cx="44%" cy="32%" r="80%">
      <stop offset="0" stop-color="#e9ecee"/>
      <stop offset="0.55" stop-color="#c2c8cb"/>
      <stop offset="1" stop-color="#8d9498"/>
    </radialGradient>
    <radialGradient id="ci-floor" cx="50%" cy="44%" r="65%">
      <stop offset="0" stop-color="#b4babd"/>
      <stop offset="1" stop-color="#90979b"/>
    </radialGradient>
    <radialGradient id="ci-hub" cx="42%" cy="36%" r="70%">
      <stop offset="0" stop-color="#4a5054"/>
      <stop offset="1" stop-color="#16191b"/>
    </radialGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#ci-bg)"/>
  <ellipse cx="400" cy="800" rx="250" ry="36" fill="#1c211c" opacity="0.12"/>

  <!-- spout lip pulled to upper-left -->
  <path d="M214 250 Q150 268 158 318 Q196 300 252 296 Q224 268 214 250 Z" fill="url(#ci-ring)"/>

  <!-- outer steel body -->
  <circle cx="400" cy="470" r="304" fill="url(#ci-ring)"/>
  <circle cx="400" cy="470" r="304" fill="none" stroke="#f4f6f7" stroke-width="3" opacity="0.6"/>
  <!-- wall -->
  <circle cx="400" cy="470" r="272" fill="url(#ci-wall)"/>
  <!-- subtle brushed arc highlights on wall -->
  <circle cx="400" cy="470" r="250" fill="none" stroke="#ffffff" stroke-width="10" opacity="0.18"/>
  <circle cx="400" cy="470" r="210" fill="none" stroke="#6f767a" stroke-width="6" opacity="0.18"/>
  <!-- floor -->
  <circle cx="400" cy="470" r="170" fill="url(#ci-floor)"/>

  <!-- measurement markings on upper-right wall -->
  <g stroke="#3d4347" stroke-width="3" stroke-linecap="round" opacity="0.85">
    <line x1="560" y1="372" x2="600" y2="360"/>
    <line x1="572" y1="408" x2="610" y2="398"/>
    <line x1="580" y1="444" x2="618" y2="438"/>
  </g>
  <g fill="#3d4347" font-family="Jost, Arial, sans-serif" font-size="22" opacity="0.85">
    <text x="612" y="368">120</text>
    <text x="624" y="406">80</text>
    <text x="630" y="446">40</text>
  </g>

  <!-- magnetic whisk -->
  <circle cx="400" cy="470" r="96" fill="#1d2225"/>
  <circle cx="400" cy="470" r="86" fill="none" stroke="#0d0f10" stroke-width="26" stroke-dasharray="3.5 7.2"/>
  <circle cx="400" cy="470" r="62" fill="none" stroke="#0d0f10" stroke-width="14" stroke-dasharray="3 6"/>
  <circle cx="400" cy="470" r="40" fill="url(#ci-hub)"/>
  <circle cx="400" cy="470" r="40" fill="none" stroke="#0c0e0f" stroke-width="2"/>
  <circle cx="400" cy="470" r="13" fill="#3a4044"/>
  <circle cx="393" cy="463" r="4" fill="#5a6064" opacity="0.8"/>
</svg>
