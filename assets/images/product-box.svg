<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The Matcha Sous gift box: deep olive packaging with a gold foil enso, reading The Sous Chef for Matcha, the first hands-free matcha mixer">
  <defs>
    <radialGradient id="bx-bg" cx="50%" cy="38%" r="80%">
      <stop offset="0" stop-color="#f7f3ea"/>
      <stop offset="1" stop-color="#e2dbc9"/>
    </radialGradient>
    <linearGradient id="bx-front" x1="200" y1="250" x2="520" y2="860" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#384330"/>
      <stop offset="1" stop-color="#28311f"/>
    </linearGradient>
    <linearGradient id="bx-side" x1="520" y1="0" x2="640" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#cbc6b5"/>
      <stop offset="1" stop-color="#a59f8d"/>
    </linearGradient>
    <linearGradient id="bx-top" x1="0" y1="200" x2="0" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#46523c"/>
      <stop offset="1" stop-color="#36412f"/>
    </linearGradient>
    <linearGradient id="bx-gold" x1="290" y1="350" x2="430" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e7d6b0"/>
      <stop offset="0.5" stop-color="#c2a36b"/>
      <stop offset="1" stop-color="#9c7e45"/>
    </linearGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#bx-bg)"/>
  <ellipse cx="410" cy="888" rx="280" ry="34" fill="#1c211c" opacity="0.16"/>

  <!-- box faces -->
  <polygon points="200,250 520,250 640,200 320,200" fill="url(#bx-top)"/>
  <polygon points="520,250 640,200 640,810 520,860" fill="url(#bx-side)"/>
  <polygon points="200,250 520,250 520,860 200,870" fill="url(#bx-front)"/>
  <!-- subtle edge sheen -->
  <line x1="520" y1="250" x2="520" y2="860" stroke="#1f2718" stroke-width="2" opacity="0.5"/>

  <!-- FRONT FACE CONTENT -->
  <!-- spiral mark -->
  <g transform="translate(282,352) scale(1.3)">
    <path d="M106 60 A43 43 0 0 1 60 100 A37 37 0 0 1 26 60 A31 31 0 0 1 60 32 A25 25 0 0 1 82 60 A19 19 0 0 1 60 76 A13 13 0 0 1 50 60 A7 7 0 0 1 60 55" stroke="url(#bx-gold)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  <!-- wordmark -->
  <text x="360" y="592" text-anchor="middle" fill="#d9c8a3" font-family="Jost, Arial, sans-serif" font-size="34" letter-spacing="11">MATCHA SOUS</text>
  <line x1="335" y1="614" x2="385" y2="614" stroke="#c2a36b" stroke-width="1.6"/>
  <text x="360" y="650" text-anchor="middle" fill="#b6ac8f" font-family="Jost, Arial, sans-serif" font-size="14" letter-spacing="4">THE SOUS CHEF FOR MATCHA</text>
  <!-- bottom line -->
  <text x="360" y="780" text-anchor="middle" fill="#9aa489" font-family="Jost, Arial, sans-serif" font-size="13" letter-spacing="3">THE FIRST HANDS-FREE</text>
  <text x="360" y="802" text-anchor="middle" fill="#9aa489" font-family="Jost, Arial, sans-serif" font-size="13" letter-spacing="3">MATCHA MIXER</text>

  <!-- SIDE FACE: feature icons -->
  <g stroke="#5f5a49" stroke-width="2" fill="none" opacity="0.8">
    <circle cx="580" cy="330" r="13"/>
    <circle cx="580" cy="330" r="4" fill="#5f5a49" stroke="none"/>
    <path d="M573 452 q7 -16 0 -28 q-7 12 0 28 z" fill="#5f5a49" stroke="none" opacity="0.85"/>
    <path d="M580 556 q11 16 0 26 q-11 -10 0 -26 z" fill="#5f5a49" stroke="none" opacity="0.85"/>
    <path d="M568 660 q12 -8 24 0 l-3 16 -18 0 z"/>
  </g>
  <g fill="#6b6655" font-family="Jost, Arial, sans-serif" font-size="9" letter-spacing="1" opacity="0.85">
    <text x="568" y="752" transform="rotate(-22 568 752)">MATCHASOUS.COM</text>
  </g>
</svg>
