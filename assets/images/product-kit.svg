<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="What's in the box: the Matcha Sous powered base, brushed steel pitcher, magnetic whisk, USB-C cable and ritual guide">
  <defs>
    <radialGradient id="kt-bg" cx="50%" cy="40%" r="80%">
      <stop offset="0" stop-color="#f7f3ea"/>
      <stop offset="1" stop-color="#e6dfce"/>
    </radialGradient>
    <linearGradient id="kt-steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b7bdc1"/>
      <stop offset="0.3" stop-color="#eef1f2"/>
      <stop offset="0.7" stop-color="#c4cacd"/>
      <stop offset="1" stop-color="#9aa1a5"/>
    </linearGradient>
    <linearGradient id="kt-base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3d40"/>
      <stop offset="1" stop-color="#141517"/>
    </linearGradient>
    <linearGradient id="kt-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e7d6b0"/>
      <stop offset="1" stop-color="#a6884f"/>
    </linearGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#kt-bg)"/>

  <!-- pitcher (top) -->
  <g>
    <ellipse cx="400" cy="300" rx="118" ry="22" fill="#1c211c" opacity="0.10"/>
    <path d="M306 118 C300 170 300 210 318 250 C336 286 464 286 482 250 C500 210 500 170 494 118 A94 26 0 0 1 306 118 Z" fill="url(#kt-steel)"/>
    <path d="M312 100 Q286 104 286 118 Q300 132 330 130 Q316 114 312 100 Z" fill="url(#kt-steel)"/>
    <ellipse cx="400" cy="118" rx="94" ry="26" fill="#3b4044"/>
    <ellipse cx="400" cy="119" rx="78" ry="20" fill="#596065"/>
    <ellipse cx="400" cy="118" rx="94" ry="26" fill="none" stroke="#eef1f2" stroke-width="2" opacity="0.6"/>
    <text x="400" y="345" text-anchor="middle" fill="#6c7066" font-family="Jost, Arial, sans-serif" font-size="15" letter-spacing="2">STEEL PITCHER</text>
  </g>

  <!-- base (middle) -->
  <g>
    <rect x="250" y="430" width="300" height="120" rx="22" fill="url(#kt-base)"/>
    <rect x="288" y="452" width="224" height="40" rx="8" fill="#0a0b0c"/>
    <g fill="#7fd9ec" font-family="Jost, Arial, sans-serif" font-size="17" font-weight="600">
      <text x="330" y="479" text-anchor="middle">1</text>
      <text x="370" y="479" text-anchor="middle">2</text>
      <text x="410" y="479" text-anchor="middle">3</text>
      <g stroke="#7fd9ec" stroke-width="2" fill="none" stroke-linecap="round">
        <circle cx="452" cy="472" r="8"/><line x1="452" y1="472" x2="452" y2="467"/>
        <path d="M486 466 A8 8 0 1 1 482 466"/>
      </g>
    </g>
    <text x="400" y="592" text-anchor="middle" fill="#6c7066" font-family="Jost, Arial, sans-serif" font-size="15" letter-spacing="2">POWERED BASE</text>
  </g>

  <!-- whisk (bottom-left) -->
  <g>
    <circle cx="220" cy="700" r="66" fill="#1d2225"/>
    <circle cx="220" cy="700" r="58" fill="none" stroke="#0d0f10" stroke-width="18" stroke-dasharray="3 6"/>
    <circle cx="220" cy="700" r="26" fill="#3a4044"/>
    <circle cx="220" cy="700" r="9" fill="#596065"/>
    <text x="220" y="800" text-anchor="middle" fill="#6c7066" font-family="Jost, Arial, sans-serif" font-size="14" letter-spacing="2">MAGNETIC WHISK</text>
  </g>

  <!-- USB-C cable (bottom-center) -->
  <g fill="none" stroke="#2b2e31" stroke-width="9" stroke-linecap="round">
    <path d="M360 660 C320 700 470 720 420 760 C380 792 470 800 470 770"/>
  </g>
  <rect x="350" y="650" width="22" height="13" rx="3" fill="#9aa1a5"/>
  <text x="408" y="828" text-anchor="middle" fill="#6c7066" font-family="Jost, Arial, sans-serif" font-size="14" letter-spacing="2">USB-C CABLE</text>

  <!-- ritual guide (bottom-right) -->
  <g>
    <rect x="540" y="648" width="116" height="104" rx="8" fill="#36412f" transform="rotate(7 598 700)"/>
    <g transform="translate(598,690) rotate(7)">
      <path d="M16 -12 A20 20 0 1 1 13 18" stroke="url(#kt-gold)" stroke-width="5" stroke-linecap="round" fill="none"/>
    </g>
    <text x="600" y="800" text-anchor="middle" fill="#6c7066" font-family="Jost, Arial, sans-serif" font-size="14" letter-spacing="2">RITUAL GUIDE</text>
  </g>
</svg>
