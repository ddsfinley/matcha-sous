<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Close-up of the Matcha Sous base: glowing touch controls with three speed settings, a built-in timer and a one-tap start">
  <defs>
    <radialGradient id="bs-bg" cx="50%" cy="35%" r="80%">
      <stop offset="0" stop-color="#f7f3ea"/>
      <stop offset="1" stop-color="#e4ddcc"/>
    </radialGradient>
    <linearGradient id="bs-base" x1="0" y1="320" x2="0" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3c3f42"/>
      <stop offset="0.5" stop-color="#222426"/>
      <stop offset="1" stop-color="#0e0f10"/>
    </linearGradient>
    <linearGradient id="bs-gloss" x1="0" y1="330" x2="0" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6b6f73" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#6b6f73" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bs-steel" x1="250" y1="0" x2="550" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b7bdc1"/>
      <stop offset="0.3" stop-color="#eef1f2"/>
      <stop offset="0.7" stop-color="#c2c8cb"/>
      <stop offset="1" stop-color="#9aa1a5"/>
    </linearGradient>
    <radialGradient id="bs-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7fd9ec" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7fd9ec" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#bs-bg)"/>
  <ellipse cx="400" cy="812" rx="280" ry="36" fill="#1c211c" opacity="0.14"/>

  <!-- hint of steel pitcher foot resting on the base -->
  <ellipse cx="400" cy="356" rx="150" ry="30" fill="url(#bs-steel)"/>
  <ellipse cx="400" cy="356" rx="150" ry="30" fill="#1c211c" opacity="0.08"/>

  <!-- base body -->
  <rect x="132" y="360" width="536" height="430" rx="40" fill="url(#bs-base)"/>
  <rect x="132" y="360" width="536" height="120" rx="40" fill="url(#bs-gloss)"/>
  <rect x="132" y="360" width="536" height="430" rx="40" fill="none" stroke="#000" stroke-width="2" opacity="0.4"/>

  <!-- LED display -->
  <rect x="300" y="430" width="200" height="50" rx="9" fill="#070809" stroke="#191a1b" stroke-width="1.5"/>
  <g fill="#7fd9ec" font-family="Jost, Arial, sans-serif" font-weight="600" opacity="0.92">
    <text x="400" y="467" font-size="30" text-anchor="middle" letter-spacing="6">0:20</text>
  </g>

  <!-- glow halos -->
  <g>
    <circle cx="250" cy="568" r="46" fill="url(#bs-glow)"/>
    <circle cx="350" cy="568" r="40" fill="url(#bs-glow)"/>
    <circle cx="450" cy="568" r="40" fill="url(#bs-glow)"/>
    <circle cx="550" cy="568" r="40" fill="url(#bs-glow)"/>
    <circle cx="250" cy="672" r="40" fill="url(#bs-glow)"/>
    <circle cx="350" cy="672" r="40" fill="url(#bs-glow)"/>
    <circle cx="450" cy="672" r="44" fill="url(#bs-glow)"/>
    <circle cx="550" cy="672" r="46" fill="url(#bs-glow)"/>
  </g>

  <!-- row 1: power, 1, 2, 3 -->
  <g stroke="#9fe6f4" stroke-width="3.4" fill="none" stroke-linecap="round">
    <circle cx="250" cy="570" r="15"/>
    <line x1="250" y1="556" x2="250" y2="571"/>
  </g>
  <g fill="#9fe6f4" font-family="Jost, Arial, sans-serif" font-weight="600">
    <text x="350" y="582" font-size="40" text-anchor="middle">1</text>
    <text x="450" y="582" font-size="40" text-anchor="middle">2</text>
    <text x="550" y="582" font-size="40" text-anchor="middle">3</text>
  </g>

  <!-- row 2: +, -, timer, start -->
  <g fill="#9fe6f4" font-family="Jost, Arial, sans-serif" font-weight="500">
    <text x="250" y="688" font-size="44" text-anchor="middle">+</text>
    <text x="350" y="684" font-size="44" text-anchor="middle">&#8211;</text>
  </g>
  <g stroke="#9fe6f4" stroke-width="3.4" fill="none" stroke-linecap="round">
    <!-- timer -->
    <circle cx="450" cy="672" r="16"/>
    <line x1="450" y1="672" x2="450" y2="662"/>
    <line x1="450" y1="672" x2="458" y2="676"/>
    <line x1="450" y1="652" x2="450" y2="656"/>
    <!-- start / rotate -->
    <path d="M566 660 A16 16 0 1 1 558 660"/>
  </g>
  <path d="M566 652 l3 8 -9 1 z" fill="#9fe6f4"/>
</svg>
