<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Matcha Sous enso mark">
  <defs>
    <linearGradient id="enso-gold" x1="20" y1="14" x2="100" y2="106" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e3d2ad"/>
      <stop offset="0.45" stop-color="#c2a36b"/>
      <stop offset="1" stop-color="#9c7e45"/>
    </linearGradient>
  </defs>
  <!-- brush ring, open on the lower-right like a hand-painted enso -->
  <path d="M86 32 A40 40 0 1 1 78 90"
        stroke="url(#enso-gold)" stroke-width="11" stroke-linecap="round" fill="none"/>
  <path d="M86 32 A40 40 0 1 1 78 90"
        stroke="#f4e9cf" stroke-width="3.2" stroke-linecap="round" fill="none" opacity="0.5"
        transform="translate(-1.4 -1.4)"/>
  <!-- tapered closing flick -->
  <path d="M78 90 q9 6 17 1" stroke="url(#enso-gold)" stroke-width="6.5" stroke-linecap="round" fill="none" opacity="0.85"/>
</svg>
