  <text x="94" y="438" fill="#f6f2e9" font-family="Jost, Arial, sans-serif" font-size="22" opacity="0.8">The first hands-free matcha mixer.</text>
  <text x="94" y="470" fill="#f6f2e9" font-family="Jost, Arial, sans-serif" font-size="22" opacity="0.8">Perfectly smooth, every time.</text>
