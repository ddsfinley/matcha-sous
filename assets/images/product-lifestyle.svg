<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The Matcha Sous mixer in a calm kitchen setting beside a bowl of freshly whisked matcha">
  <defs>
    <linearGradient id="lf-wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efe8d9"/>
      <stop offset="1" stop-color="#e0d8c5"/>
    </linearGradient>
    <linearGradient id="lf-counter" x1="0" y1="640" x2="0" y2="1000" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d8cdb6"/>
      <stop offset="1" stop-color="#c4b89c"/>
    </linearGradient>
    <linearGradient id="lf-steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b7bdc1"/>
      <stop offset="0.3" stop-color="#eef1f2"/>
      <stop offset="0.7" stop-color="#c4cacd"/>
      <stop offset="1" stop-color="#9aa1a5"/>
    </linearGradient>
    <linearGradient id="lf-base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3d40"/>
      <stop offset="1" stop-color="#141517"/>
    </linearGradient>
    <radialGradient id="lf-matcha" cx="50%" cy="40%" r="60%">
      <stop offset="0" stop-color="#9bb24e"/>
      <stop offset="1" stop-color="#6d8a33"/>
    </radialGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#lf-wall)"/>
  <rect y="660" width="800" height="340" fill="url(#lf-counter)"/>
  <line x1="0" y1="660" x2="800" y2="660" stroke="#b3a78b" stroke-width="2"/>

  <!-- soft light -->
  <ellipse cx="300" cy="300" rx="320" ry="280" fill="#fffdf6" opacity="0.35"/>

  <!-- branch silhouette (zen accent) -->
  <g stroke="#7c8765" stroke-width="3" fill="none" opacity="0.5" stroke-linecap="round">
    <path d="M40 60 C120 120 150 180 150 260"/>
    <path d="M150 150 q40 -20 70 -10"/><path d="M150 200 q44 -10 78 6"/>
    <ellipse cx="226" cy="138" rx="16" ry="7" fill="#7c8765" stroke="none" transform="rotate(-20 226 138)"/>
    <ellipse cx="232" cy="208" rx="17" ry="7" fill="#7c8765" stroke="none" transform="rotate(15 232 208)"/>
  </g>

  <!-- device on the right -->
  <g>
    <ellipse cx="540" cy="676" rx="150" ry="22" fill="#1c211c" opacity="0.14"/>
    <rect x="430" y="566" width="220" height="100" rx="26" fill="url(#lf-base)"/>
    <rect x="470" y="586" width="140" height="30" rx="6" fill="#0a0b0c"/>
    <g fill="#7fd9ec" font-family="Jost, Arial, sans-serif" font-size="14" font-weight="600">
      <text x="506" y="607" text-anchor="middle">1</text><text x="540" y="607" text-anchor="middle">2</text><text x="574" y="607" text-anchor="middle">3</text>
    </g>
    <!-- pitcher -->
    <path d="M462 360 C456 416 456 470 476 512 C496 552 584 552 604 512 C624 470 624 416 618 360 A78 22 0 0 1 462 360 Z" fill="url(#lf-steel)"/>
    <path d="M468 344 Q444 348 444 360 Q458 372 484 370 Q472 356 468 344 Z" fill="url(#lf-steel)"/>
    <ellipse cx="540" cy="360" rx="78" ry="22" fill="#3b4044"/>
    <ellipse cx="540" cy="361" rx="64" ry="17" fill="#586065"/>
    <ellipse cx="540" cy="360" rx="78" ry="22" fill="none" stroke="#eef1f2" stroke-width="2" opacity="0.6"/>
    <ellipse cx="525" cy="455" rx="12" ry="80" fill="#fff" opacity="0.3"/>
  </g>

  <!-- matcha bowl on the left -->
  <g>
    <ellipse cx="250" cy="690" rx="118" ry="20" fill="#1c211c" opacity="0.12"/>
    <path d="M156 612 Q160 690 250 692 Q340 690 344 612 Z" fill="#6b5b4a"/>
    <path d="M156 612 Q160 600 250 598 Q340 600 344 612 Q340 632 250 634 Q160 632 156 612 Z" fill="#7a6a57"/>
    <ellipse cx="250" cy="610" rx="92" ry="18" fill="url(#lf-matcha)"/>
    <ellipse cx="238" cy="606" rx="40" ry="8" fill="#acc06a" opacity="0.7"/>
    <!-- foam swirl -->
    <path d="M214 610 q36 -10 72 2" stroke="#cdd98f" stroke-width="2.5" fill="none" opacity="0.7"/>
  </g>
</svg>
