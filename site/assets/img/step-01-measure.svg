<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 150" fill="none" role="img" aria-label="Cartoon kitchen scale weighing a little pile of matcha">
  <g stroke="#2f3a30" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- scale body -->
    <rect x="30" y="88" width="90" height="34" rx="10" fill="#c2a36b"/>
    <rect x="46" y="99" width="30" height="13" rx="4" fill="#f6f2e9" stroke-width="4"/>
    <circle cx="102" cy="105" r="6" fill="#f6f2e9" stroke-width="4"/>
    <!-- plate -->
    <line x1="75" y1="88" x2="75" y2="78"/>
    <rect x="37" y="66" width="76" height="12" rx="6" fill="#ece5d6"/>
    <!-- matcha mound -->
    <path d="M55 66 Q75 40 95 66 Z" fill="#8fae5a"/>
    <path d="M64 58 Q75 48 86 58" stroke="#6d8a3e" stroke-width="4" fill="none"/>
  </g>
  <!-- reading + sparkles -->
  <text x="61" y="110" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2f3a30" text-anchor="middle">2g</text>
  <g stroke="#c2a36b" stroke-width="4" stroke-linecap="round">
    <path d="M117 46 v12 M111 52 h12"/>
    <path d="M32 38 v8 M28 42 h8"/>
  </g>
</svg>
