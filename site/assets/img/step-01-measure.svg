<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 150" fill="none" role="img" aria-label="A happy matcha tin beside a spoon heaping green powder">
  <g stroke="#2f3a30" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- tin body -->
    <rect x="34" y="52" width="52" height="58" rx="14" fill="#c2a36b"/>
    <rect x="30" y="42" width="60" height="16" rx="8" fill="#ece5d6"/>
    <!-- spoon with mound -->
    <path d="M108 44 a13 10 0 1 0 0.1 0 Z" fill="#ece5d6"/>
    <path d="M100 38 q8 -10 16 -1" fill="#8fae5a" stroke="none"/>
    <path d="M96 40 q12 -14 24 -1" fill="none"/>
    <line x1="118" y1="52" x2="128" y2="66"/>
  </g>
  <!-- falling pinches -->
  <g fill="#8fae5a"><circle cx="104" cy="66" r="2.6"/><circle cx="110" cy="76" r="2.2"/><circle cx="104" cy="86" r="2.4"/></g>
  <!-- tin face -->
  <circle cx="50" cy="76" r="2.8" fill="#2f3a30"/>
  <circle cx="70" cy="76" r="2.8" fill="#2f3a30"/>
  <path d="M54 85 q6 5 12 0" stroke="#2f3a30" stroke-width="3.4" stroke-linecap="round" fill="none"/>
  <circle cx="43" cy="84" r="3.4" fill="#d98e73" opacity=".45"/>
  <circle cx="77" cy="84" r="3.4" fill="#d98e73" opacity=".45"/>
</svg>
