<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 150" fill="none" role="img" aria-label="The Matcha Sous character happily whisking a swirl of green">
  <!-- motion arcs -->
  <g stroke="#c2a36b" stroke-width="3.4" stroke-linecap="round" fill="none">
    <path d="M28 52 q-7 10 0 20"/><path d="M122 52 q7 10 0 20"/>
  </g>
  <g stroke="#2f3a30" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- cup -->
    <path d="M46 42 q0 -6 6 -6 h46 q6 0 6 6 v20 q0 22 -29 22 q-29 0 -29 -22 Z" fill="#ece5d6"/>
    <!-- surface + swirl -->
    <ellipse cx="75" cy="46" rx="23" ry="8" fill="#8fae5a"/>
    <path d="M75 46 a10 5 0 1 1 -10 5 a6 3 0 1 0 6 -3" fill="none" stroke="#55702c" stroke-width="4.2"/>
    <!-- base -->
    <rect x="40" y="90" width="70" height="32" rx="14" fill="#2f3a30" stroke="none"/>
  </g>
  <!-- face on base -->
  <circle cx="66" cy="103" r="3" fill="#f6f2e9"/>
  <circle cx="84" cy="103" r="3" fill="#f6f2e9"/>
  <path d="M68 111 q7 5.6 14 0" stroke="#f6f2e9" stroke-width="3.4" stroke-linecap="round" fill="none"/>
  <circle cx="56" cy="110" r="2.8" fill="#d98e73" opacity=".4"/>
  <circle cx="94" cy="110" r="2.8" fill="#d98e73" opacity=".4"/>
  <!-- sparkles -->
  <g stroke="#c2a36b" stroke-width="3.4" stroke-linecap="round">
    <path d="M120 26 v9 M115.5 30.5 h9"/>
    <path d="M30 30 v7 M26.5 33.5 h7"/>
  </g>
</svg>
