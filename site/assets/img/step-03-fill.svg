    <line x1="66" y1="106" x2="74" y2="106" stroke-width="4"/>
    <line x1="66" y1="116" x2="74" y2="116" stroke-width="4"/>
  </g>
  <path d="M36 100 a18 8 0 0 0 36 0 Z" fill="#9fb8c4"/>
</svg>
