    <!-- kettle -->
    <path d="M78 30 h34 a12 12 0 0 1 12 12 v14 a12 12 0 0 1 -12 12 h-34 a12 12 0 0 1 -12 -12 v-14 a12 12 0 0 1 12 -12 Z" fill="#c2a36b"/>
    <path d="M66 44 l-16 6 8 10" fill="#c2a36b"/>
    <path d="M84 30 q11 -12 22 0" fill="none"/>
  </g>
  <!-- water stream + steam -->
  <path d="M52 62 q-6 12 2 20 q7 8 1 18" stroke="#9fb8c4" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M118 22 q6 -8 0 -14" stroke="#9a9d92" stroke-width="4" stroke-linecap="round" fill="none"/>
  <g stroke="#2f3a30" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
