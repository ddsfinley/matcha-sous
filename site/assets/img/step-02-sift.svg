<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 150" fill="none" role="img" aria-label="A smiling sieve sprinkling matcha confetti into a delighted bowl">
  <g stroke="#2f3a30" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- sieve -->
    <path d="M38 46 a26 12 0 0 0 52 0 Z" fill="#ece5d6"/>
    <ellipse cx="64" cy="46" rx="26" ry="10" fill="#f6f2e9"/>
    <line x1="90" y1="43" x2="116" y2="34"/>
    <line x1="52" y1="52" x2="52" y2="58" stroke-width="3"/>
    <line x1="64" y1="54" x2="64" y2="60" stroke-width="3"/>
    <line x1="76" y1="52" x2="76" y2="58" stroke-width="3"/>
  </g>
  <!-- sieve face on rim -->
  <circle cx="57" cy="45" r="2.4" fill="#2f3a30"/>
  <circle cx="71" cy="45" r="2.4" fill="#2f3a30"/>
  <path d="M60 50 q4 3.4 8 0" stroke="#2f3a30" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- confetti -->
  <g fill="#8fae5a">
    <circle cx="52" cy="72" r="2.6"/><circle cx="66" cy="78" r="2.2"/><circle cx="58" cy="88" r="2.4"/><circle cx="72" cy="92" r="2"/>
  </g>
  <g stroke="#2f3a30" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- bowl -->
    <path d="M34 104 a30 17 0 0 0 60 0 Z" fill="#c2a36b"/>
    <ellipse cx="64" cy="104" rx="30" ry="7" fill="#8fae5a" stroke-width="3.4"/>
  </g>
  <!-- bowl face -->
  <circle cx="55" cy="115" r="2.4" fill="#2f3a30"/>
  <circle cx="73" cy="115" r="2.4" fill="#2f3a30"/>
  <path d="M59 120 q5 4 10 0" stroke="#2f3a30" stroke-width="3" stroke-linecap="round" fill="none"/>
</svg>
