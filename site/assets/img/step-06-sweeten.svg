<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 150" fill="none" role="img" aria-label="Cartoon honey dipper dripping golden honey into a steaming cup of matcha">
  <g stroke="#2f3a30" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- honey dipper -->
    <g transform="rotate(18 96 40)">
      <line x1="96" y1="14" x2="96" y2="40"/>
      <path d="M84 44 h24 M86 51 h20 M88 58 h16" stroke="#c2a36b" stroke-width="7"/>
    </g>
  </g>
  <!-- honey drip -->
  <path d="M92 66 q0 10 0 16 q0 8 -4 12" stroke="#c2a36b" stroke-width="6" stroke-linecap="round" fill="none"/>
  <circle cx="86" cy="100" r="4" fill="#c2a36b"/>
  <g stroke="#2f3a30" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- cup -->
    <path d="M34 96 a26 14 0 0 0 52 0 v-8 h-52 Z" fill="#ece5d6"/>
    <ellipse cx="60" cy="88" rx="26" ry="8" fill="#8fae5a" stroke-width="4"/>
    <path d="M86 92 h8 a8 8 0 0 1 0 16 h-6" fill="none"/>
  </g>
  <!-- steam + sparkle -->
  <g stroke="#9a9d92" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M50 72 q5 -7 0 -13"/><path d="M64 74 q5 -7 0 -13"/>
  </g>
  <g stroke="#c2a36b" stroke-width="4" stroke-linecap="round"><path d="M28 40 v10 M23 45 h10"/></g>
</svg>
