<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 150" fill="none" role="img" aria-label="A honey pot character tipping a golden drop into a happy cup, a small heart of steam rising">
  <g stroke="#2f3a30" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- honey pot tipping -->
    <g transform="rotate(12 96 44)">
      <path d="M74 42 q0 -18 22 -18 q22 0 22 18 q0 16 -22 16 q-22 0 -22 -16 Z" fill="#c2a36b"/>
      <rect x="86" y="16" width="20" height="10" rx="4" fill="#ece5d6"/>
    </g>
  </g>
  <!-- pot face -->
  <g transform="rotate(12 96 44)">
    <circle cx="89" cy="42" r="2.6" fill="#2f3a30"/>
    <circle cx="103" cy="42" r="2.6" fill="#2f3a30"/>
    <path d="M92 49 q4.5 3.6 9 0" stroke="#2f3a30" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>
  <!-- drop -->
  <path d="M80 60 q0 10 -1 16" stroke="#c2a36b" stroke-width="5" stroke-linecap="round"/>
  <path d="M79 88 q-6 -7 0 -12 q6 5 0 12 Z" fill="#c2a36b" stroke="#c2a36b"/>
  <g stroke="#2f3a30" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- cup -->
    <path d="M30 100 a26 15 0 0 0 52 0 v-6 h-52 Z" fill="#ece5d6"/>
    <ellipse cx="56" cy="94" rx="26" ry="7" fill="#8fae5a" stroke-width="3.4"/>
    <path d="M82 98 h7 a8 8 0 0 1 0 15 h-5" fill="none"/>
  </g>
  <!-- cup face -->
  <circle cx="47" cy="108" r="2.4" fill="#2f3a30"/>
  <circle cx="65" cy="108" r="2.4" fill="#2f3a30"/>
  <path d="M51 113 q5 4 10 0" stroke="#2f3a30" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- heart steam -->
  <path d="M46 76 q-4 -5 0 -8 q2 -2 4 0 q2 -2 4 0 q4 3 0 8 l-4 4 Z" fill="#d98e73" opacity=".7"/>
</svg>
