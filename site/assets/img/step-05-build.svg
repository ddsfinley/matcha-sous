<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 150" fill="none" role="img" aria-label="A cheerful iced latte glass with a striped straw, green matcha resting on milk and ice">
  <g stroke="#2f3a30" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- straw -->
    <line x1="92" y1="14" x2="104" y2="44" stroke="#2f3a30" stroke-width="9"/>
    <line x1="92" y1="14" x2="104" y2="44" stroke="#c2a36b" stroke-width="5"/>
    <!-- glass -->
    <path d="M48 40 h54 l-5 74 q-1 8 -9 8 h-26 q-8 0 -9 -8 Z" fill="#f6f2e9"/>
    <!-- milk -->
    <path d="M52 78 h46 l-3 34 q-1 6 -6 6 h-28 q-5 0 -6 -6 Z" fill="#ffffff" stroke="none"/>
    <!-- matcha cap -->
    <path d="M50 52 h50 l-2 26 h-46 Z" fill="#8fae5a" stroke="none"/>
    <!-- ice peeking in the green -->
    <rect x="58" y="56" width="14" height="14" rx="4" fill="#dfe9ee" transform="rotate(-9 65 63)"/>
    <rect x="80" y="60" width="13" height="13" rx="4" fill="#dfe9ee" transform="rotate(11 86 66)"/>
    <path d="M48 40 h54"/>
  </g>
  <!-- glass face on the milk band -->
  <circle cx="66" cy="96" r="2.8" fill="#2f3a30"/>
  <circle cx="84" cy="96" r="2.8" fill="#2f3a30"/>
  <path d="M70 104 q5 4.4 10 0" stroke="#2f3a30" stroke-width="3.2" stroke-linecap="round" fill="none"/>
  <circle cx="58" cy="103" r="3.2" fill="#d98e73" opacity=".45"/>
  <circle cx="92" cy="103" r="3.2" fill="#d98e73" opacity=".45"/>
  <!-- sparkle -->
  <g stroke="#c2a36b" stroke-width="3.4" stroke-linecap="round"><path d="M116 74 v9 M111.5 78.5 h9"/></g>
</svg>
